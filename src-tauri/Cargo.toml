[workspace]
members = [".", "core"]
resolver = "2"

[package]
name = "nexus"
version = "1.1.3"
description = "NEXUS — futuristic AI productivity & time management command center"
authors = ["NEXUS contributors"]

edition = "2021"
default-run = "nexus"

[lib]
name = "nexus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
nexus-core = { path = "core" }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native"] }
sysinfo = { version = "0.33", default-features = false, features = ["system", "component"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Foundation",
  "Foundation_Collections",
  "Globalization",
  "Media_SpeechRecognition",
  "Media_Ocr",
  "Graphics_Imaging",
  "Storage_Streams",
  "Win32_Graphics_Gdi",
  "Win32_System_WinRT",
  "Win32_System_Performance",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_Media",
  "Win32_System_RemoteDesktop",
  "Wdk_Graphics_Direct3D",
] }
ferrisetw = "1.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
