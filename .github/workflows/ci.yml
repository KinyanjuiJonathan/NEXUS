name: CI & Windows installer

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish this build as a release (v + the version in package.json) once every test has passed"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (TypeScript + Rust)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev libxdo-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Rust tests (persistence core)
        run: cargo test --manifest-path src-tauri/Cargo.toml -p nexus-core
      - name: Clippy
        run: |
          mkdir -p dist && touch dist/index.html
          cargo clippy --manifest-path src-tauri/Cargo.toml --workspace --all-targets -- -D warnings

  windows:
    name: Windows build & installer
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Rust tests on Windows
        run: cargo test --manifest-path src-tauri/Cargo.toml -p nexus-core
      - name: Build NSIS + MSI installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # A release is made in two cases, always after the tests above have passed:
          #  - "Run workflow" with "publish" ticked: published as v<version from package.json>, with the installers attached;
          #  - a pushed version tag (v1.2.3): a draft release for that tag.
          # Installing a release over an older version keeps the user's data (it lives in %APPDATA%, not in the program folder).
          tagName: ${{ inputs.publish && 'v__VERSION__' || (startsWith(github.ref, 'refs/tags/v') && github.ref_name || '') }}
          releaseName: ${{ inputs.publish && 'NEXUS v__VERSION__' || (startsWith(github.ref, 'refs/tags/v') && format('NEXUS {0}', github.ref_name) || '') }}
          releaseBody: "See CHANGELOG.md for what changed. Install over your current version: your tasks, schedule, history and settings are kept."
          releaseDraft: ${{ !inputs.publish }}
          prerelease: false
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: nexus-windows-installers
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
